# The release pipeline: this repository reacts to its OWN release TAG and publishes the tarball.
#
# THE VERSION TAG IS STILL THE DURABLE STAMP, BUT IT NO LONGER TRIGGERS. Under the release-request
# flow the tag is written by qits-githost's tag primitive, which announces nothing — the trigger is
# qits-projects' `SCMRelease`. A bootstrap replay therefore re-establishes a release by pushing the
# tag quietly and re-presenting the `SCMRelease` through qits-ci's manual trigger door
# (`POST /ci/api/events/trigger`), which runs this same pipeline. qits-ci still announces
# `SoftwareRelease` only where a green run and an `SCMRelease` meet.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT. Nothing in this file
# pushes a tag; it only reads one. The event that could loop is `SoftwareRelease`, and this file
# neither listens for it nor emits it.
#
# THAT ANNOUNCEMENT IS STILL THE SPLIT'S WHOLE POINT. `SoftwareRelease` used to fire at the push,
# which every consumer read as "the package is in the registry" — with an entire upstream build in
# the gap. A downstream bump pipeline can install what it was told about, because this pipeline went
# green first.
#
# `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything, so it
# cannot see what the step below pushed; it announces `{repository, version, packageType,
# packageName}` on the strength of these lines. Keep them true. The name is the exact registry
# name and has to be quoted, since `@` is a reserved YAML indicator.
#
# TWO ENTRIES, ONE RUN, TWO EVENTS. The tarball and the workbench are built from the same tree by
# the same step, so they belong to one release rather than two pipelines — and the repeated name is
# the point rather than duplication: they are two things arriving at two addresses, one resolvable
# by `pnpm add` and one readable in a browser. A consumer that wants "the docs are up" triggers on
# `SoftwareRelease{packageType: docs}`.
#
# WHY THIS FILE AND NOT A SoftwareRelease-TRIGGERED ONE. SoftwareRelease is a release pipeline's
# OUTPUT — qits-ci publishes one per entry above when this run goes green. A docs pipeline hanging
# off it would mean a second full `pnpm install` and build, gated on the npm publish, to produce
# something that does not depend on the tarball existing. The tag is what says "the tree is there,
# go build it", and that is what docs need too.
#
# THE FILE HAS TO BE IN PLACE BEFORE THE TAG IT SELECTS IS PUSHED: the bus is at-most-once with no
# catch-up and no replay, so a trigger file arriving after its event loses that release and looks
# like a train that quietly did not roll.
event: SCMRelease
when:
  # SCMRelease, not SCMPublishTag: under the release-request flow the version tag is written by
  # qits-githost's tag primitive, which fires no post-receive and so publishes no SCMPublishTag —
  # a recipe listening for the tag event never runs again. qits-projects' Auto Release publishes
  # SCMRelease carrying the repository's public name, and a bootstrap replay arrives as this same
  # event through qits-ci's manual trigger door. A rename updates this line in the same campaign.
  - repository: { exact: qits-ui-components-jslib }
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: npm, name: "@qits/ui-components" }
  - { type: docs, name: "@qits/ui-components" }
steps:
  - image: qits/build-images/node-base:latest
    # The push pipeline's budget. This step installs and builds the same way and runs neither the
    # tests nor the workbench, so it cannot be the slower of the two.
    timeout-seconds: 1800
    script: |
      # -u is load-bearing for the same reason it is in ci-post-receive.yml: with the registry vars
      # unset, an unset-tolerant script writes a registry-less .npmrc and publishes to npmjs.org
      # instead of failing here.
      set -eu

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD — there is no per-field projection — and node parses it because
      # node-base carries no jq.
      #
      # THE TAG NAME IS THE VERSION, so its shape is checked before anything is built: nothing
      # upstream vets a tag now that any tag push reaches here, and this string becomes the npm
      # coordinate and the docs URL. A CalVer is digits and dots.
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      case "$version" in
        ''|*[!0-9.]*) echo "not a CalVer tag: $version" >&2; exit 1 ;;
      esac
      echo "releasing @qits/ui-components@$version"

      # THE TAG IS THE CHECKOUT TARGET, and it is the only reason this run needs one. An
      # event-triggered run is cloned at the head of main, which is where the release commit is
      # *now* — a later push moves that, and the tag does not, so a busy main cannot make this
      # pipeline publish a different tree than the one that was released. The clone is shallow and
      # carries no tags, hence the explicit refspec; the URL rather than `origin` because every
      # address a step needs arrives as environment. `checkout --detach` peels the annotated tag to
      # its commit.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      cat > ~/.npmrc <<EOF
      registry=${QITS_NPM_PROXY_URL}
      @qits:registry=${QITS_NPM_REGISTRY_URL}
      # npm-CLI ceremony only — qits-platform-artifacts requires and reads no credential.
      ${QITS_NPM_REGISTRY_URL#http:}:_authToken=qits-ci
      EOF

      # A VERSION BELOW THE REGISTRY'S `latest` IS A REPLAY, not a release. A bootstrap replays
      # every version the estate still pins, onto a registry that may already hold a newer one.
      # npm refuses to move `latest` backwards without an explicit tag, so such a publish claims
      # the throwaway `replay` tag instead, and `main` stays where the real release left it.
      replay=no
      latest=$(npm view @qits/ui-components version 2>/dev/null || true)
      order=$(node -p 'const p=v=>v.split(".").map(Number);const [a,b]=process.argv.slice(1).map(p);let r="same";for(let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]||0,y=b[i]||0;if(x!==y){r=x<y?"below":"above";break}}r' "$version" "${latest:-0}")
      if [ "$order" = below ]; then
        echo "$version is below latest $latest — a replay: it takes the replay tag and leaves main alone"
        replay=yes
      fi

      # PUBLISH-IF-ABSENT, the same guard the push pipeline carries, and it earns its place here for
      # a sharper reason: an event can be redelivered and versions are immutable, so a second run of
      # one release must go green rather than fight the registry. Since the trigger is the tag, this
      # is also what makes a warm bootstrap cheap — the replay re-pushes the tags every time, and a
      # version the registry already holds costs a probe.
      #
      # IT SETS A FLAG RATHER THAN EXITING, and that changed when this step gained a second artifact.
      # `exit 0` here was right while npm was the only thing published; with docs below it, a
      # redelivery whose npm half had landed and whose docs half had NOT would skip the repair and
      # report green — the release would be permanently half-published with nothing saying so. Each
      # artifact now answers the already-there question for itself.
      publish_npm=yes
      if npm view "@qits/ui-components@$version" version >/dev/null 2>&1; then
        echo "@qits/ui-components@$version is already published — skipping the npm publish"
        publish_npm=no
      fi

      pnpm install --frozen-lockfile
      pnpm build

      # THE ONE ASSERTION WORTH MAKING. The release commit carries the stamped version in its
      # manifest, and the tag is the coordinate everything else names — two sources for one number.
      # If they ever disagreed, the tarball published under the tag would carry a different version
      # inside it, and the SoftwareRelease a real release announces would name one nobody published.
      # Stop here instead.
      built=$(node -p "require('./dist/qits-spa-ui-components/package.json').version")
      if [ "$built" != "$version" ]; then
        echo "the tag says $version and the built manifest says $built"
        exit 1
      fi

      # NO --tag FOR A RELEASE, DELIBERATELY: claiming `latest` is what a release is for. The
      # registry allows it because it refuses only a move that goes *backwards* — which is the
      # replay case above, and that one publishes under `replay`.
      if [ "$publish_npm" = yes ]; then
        if [ "$replay" = yes ]; then
          npm publish ./dist/qits-spa-ui-components --tag replay
        else
          npm publish ./dist/qits-spa-ui-components
        fi
      fi

      # AND `main` NAMES THE SAME VERSION. Not a second publish — `npm publish` can claim exactly one
      # dist-tag and a version is immutable, so the only way to be under both is to move the tag
      # afterwards, which is what qits-artifacts' npm registry grew a `/-/package/…/dist-tags` route
      # for.
      #
      # WHAT `main` MEANS NOW. It used to be the per-push pipeline's `<release>-main.g<sha>`
      # prerelease, republished on every push to main. That pipeline is retired, and with it the only
      # thing that ever wrote this tag: `@qits/ui-components@main` froze on
      # 2026.902.204627-main.geec9f2c while releases kept going out under `latest`. Under the
      # release-request flow main only advances at a release, so the honest reading of the tag is
      # "the latest released main" — which is one tag move per release, here.
      #
      # UNCONDITIONAL, outside the flag above, for the reason that turned `exit 0` into a flag in the
      # first place and the reason the SBOM PUT below is unconditional: a redelivery whose publish
      # landed and whose tag move did not would skip the repair and report green, leaving `main` a
      # release behind with nothing saying so. Moving a tag onto the version it already names is what
      # npm calls "already set" and costs one request. A replay is the one exception: an older
      # version must not pull `main` back.
      if [ "$replay" = no ]; then
        npm dist-tag add "@qits/ui-components@$version" main
      fi

      # THE SBOM, WHICH IS THE TARBALL'S RESOLVED DEPENDENCY TREE. It goes up before the run goes
      # green, so the `SoftwareRelease` a real release announces can never name a version whose bill
      # of materials is missing, and a failed PUT fails the release on purpose — the store being
      # unreachable is not a reason to announce a version nobody can audit.
      #
      # IT SITS HERE RATHER THAN AT THE END OF THE STEP. The workbench below is the slow half of this
      # step by a wide margin; an SBOM that cannot be produced or cannot be stored should say so
      # before that runs, not after.
      #
      # IT IS UNCONDITIONAL, unlike the npm publish above, and for the reason that turned `exit 0`
      # into a flag: a redelivery whose npm half had landed and whose SBOM had not would otherwise
      # skip the repair and report green. The store answers a replay with 200 rather than a conflict,
      # so re-sending an SBOM that is already there costs one request.
      #
      # cdxgen, NOT @cyclonedx/cyclonedx-npm: this repository's lockfile is `pnpm-lock.yaml` and
      # cyclonedx-npm reads `package-lock.json` only — there is no flag that changes that. It comes
      # through the mirror like every other package; `--registry` explicitly, because `npm exec`
      # resolves the tool itself and the `@qits:` line in ~/.npmrc covers only the scope that owns
      # this package.
      #
      # THIS IS THE NODE PILOT. Whether cdxgen's transitive graph over a pnpm workspace is complete
      # enough to be worth storing is the question this one repository is here to answer; the rest of
      # the node side waits on it.
      npm exec --yes --registry "$QITS_NPM_PROXY_URL" -- \
        @cyclonedx/cdxgen@11.2.7 -t pnpm --spec-version 1.6 -o sbom.json .
      # Derived from the injected npm root, never spelled: the SBOM store is a sibling path of the
      # registry inside the same qits-platform-artifacts deployment, exactly as $QITS_DOCS_URL is.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @sbom.json \
        "$sbom_base/npm/@qits/ui-components/-/$version"

      # THE WORKBENCH, AS THE SECOND DECLARED ARTIFACT. Same tree, same version, same run — see the
      # `artifacts:` header on why this is not a pipeline of its own.
      #
      # It is built HERE rather than reused from the push pipeline because no state crosses runs, let
      # alone steps: this container cloned the tag itself and has to produce everything it publishes.
      #
      # `-C storybook-static .` names every entry `./index.html`. That is the spelling tar produces
      # and the publish path normalises away; the alternative — `tar -czf … storybook-static` — would
      # nest the whole site one directory deep and every URL would carry the directory.
      pnpm build-storybook
      tar -czf storybook.tgz -C storybook-static .

      # curl, not node's fetch. qits-spa-home's maintenance leg routes an HTTP call through node and
      # says node-base "promises no curl"; that is no longer true of this image — node-base installs
      # bash, curl and git explicitly (images/qits-oci/node-base/Dockerfile) — and a 10 MB binary
      # upload is what curl is for.
      #
      # $QITS_DOCS_URL is qits-platform-artifacts' docs root INCLUDING its repository segment, injected into
      # every step container like the npm and maven roots, so no deployment address is spelled here.
      #
      # PUBLISH-IF-ABSENT, the discipline the npm half carries and for the same reason: an event can
      # be redelivered and a version is immutable, so a second run of one release must go green
      # rather than fight the store. The store's answer to a republish is 409, so that is the one
      # status treated as success — everything else fails the release. `-w` prints the code without
      # `-f` swallowing the body, and the body is the whole diagnostic when it is neither 201 nor 409.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @storybook.tgz \
        "$QITS_DOCS_URL/@qits/ui-components/-/$version")
      case "$status" in
        201) echo "published docs for @qits/ui-components@$version" ;;
        409) echo "docs for @qits/ui-components@$version are already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
